# Планеты. Сторона size, скругление round (блоки), цвет #rrggbb, атмосфера #rrggbbaa (aa=00 — без неё).
# approach — ближе стольких блоков до поверхности начинается вход: затемнение, перенос на карту target в точку tx ty tz.
# Посадка с кораблём (модуль vessels, у планеты с target): корабль, пилот и стоящие на корабле — на карту target в
# случайную точку круга радиуса ship-scatter у (ship-x, ship-z); появляется на ship-entry-y и за ship-descent секунд
# плавно опускается до ship-y (абсолютный Y; рельеф выше — над рельефом с подушкой). Выше ship-exit-y на карте
# планеты — взлёт обратно в космос (к этой планете). Высоты выше верха карты урезаются (в лог).
planets:
  terra:
    map: cubes
    x: 0
    y: 3200
    z: 2600
    size: 2048
    round: 256
    seed: 20261124
    color: "#4f8f4a"
    atmosphere: "#7fb4ff70"
    approach: 50
    target: world
    tx: 0.5
    ty: 42
    tz: 0.5
    ship-scatter: 2000
    ship-x: 0
    ship-z: 0
    ship-entry-y: 2400
    ship-y: 2000
    ship-descent: 6
    ship-exit-y: 2600
