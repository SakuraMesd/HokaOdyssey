# Свои блоки. Рисует их мод Hoka Odyssey: текстуры и модели берутся с сервера и появляются у игроков сразу —
# без ресурспака, без загрузки ресурсов и без пересборки мода. Под капотом каждый блок — ванильное состояние-
# «носитель» (его физику, хитбокс, звук и скорость ломания игра знает сама), мод рисует поверх него своё.
#
# Файлы (PNG, .bbmodel) — в module/blocks/assets/ (можно папками). Изменили описание или файл →
#   /hoblock reload   — у игроков блоки обновятся сразу.
# Выдать блок: /hoblock give <id> [кол-во]. Список: /hoblock.
#
# Поля блока:
#   name        — название предмета
#   type        — носитель:
#                   solid       — полный твёрдый блок (нотный блок, ~1100 мест). Закрывает соседей — для
#                                 непрозрачных кубов
#                   transparent — полный твёрдый, но не закрывает соседей (листва, 63 места) — для моделей
#                                 и текстур с дырками
#                   passable    — сквозь него ходят (растяжка, 127 мест) — декор: трава, цветы, таблички
#                 по умолчанию: с моделью — transparent, иначе solid
#   texture     — PNG на все грани; уточнить: side / top / bottom, или north / south / east / west / up / down
#   model       — .bbmodel вместо текстур (поза по умолчанию; формат «Java Block» — 0..16, другие — центр в 0)
#   rotatable   — true: ставится «лицом» к игроку (4 стороны, 4 места носителя)
#   layer       — cutout (по умолчанию: прозрачные пиксели — дырки), solid (без дыр), translucent (полупрозрачность)
#   particle    — PNG для частиц ломания (по умолчанию — первая текстура)
#   ao          — мягкие тени в углах (по умолчанию true)
#   sounds      — звуки блока (по умолчанию — как у носителя):
#                   type: stone | wood | metal | glass | grass | gravel | sand | wool | snow | anvil | lantern |
#                         copper | deepslate | amethyst | moss | … (ванильный набор за основу)
#                   break / place / step / hit / fall — свой звук из модуля hosounds (crate_open = hoka:crate_open)
#                         или ванильный (minecraft:block.stone.break)
#                   volume / pitch — громкость и высота набора
#   size        — многоклеточный блок: клеток по X, Y, Z, например [2, 1, 2]. Игрок ставит главную клетку (наименьшие
#                 X, Z до поворота), остальные встают сами; нужно место и опора под всеми клетками. Ломание любой
#                 части убирает все и даёт один предмет. Модель одна на весь блок: «Java Block» — 0..16·X, 0..16·Z
#                 от главной клетки; другие форматы — центр модели (0, 0) в середине всего габарита. Каждая часть ×
#                 поворот — своё место носителя (2×1×2 с поворотом = 16 мест)
#   shape       — хитбокс одной клетки в пикселях [x1, y1, z1, x2, y2, z2] (0..16 по X/Z, по Y до 32 — как у забора);
#                 и коллизия, и рамка выделения. По умолчанию — полный куб
#   animation   — анимация из модели, которую мод проигрывает в мире (время общее по миру; вблизи — каждый кадр,
#                 дальше 48 блоков — поза по умолчанию)
#   window      — окно houi (module/houi/menus/<window>.json), которое открывает ПКМ по блоку; другим модулям —
#                 событие HoBlockUseEvent
#
# Носители раздаются один раз и запоминаются в states.yml — не правьте его руками (иначе в построенном мире
# блоки поменяются местами). Без мода игрок видит сами носители (нотный блок, листву, растяжку).
blocks:
  test_crate:
    name: "Тестовый ящик"
    texture: test_crate.png
    top: test_crate_top.png
    sounds:
      type: wood
      place: crate_close
      break: crate_open
