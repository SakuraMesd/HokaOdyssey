# Реактивный ранец (модуль jetpack). После правки — /hojet reload.
# Ранец надевается в слот нагрудника (ПКМ с ранцем в руке — надеть). Топливо хранится в самом ранце.
# Полёт считает клиентский модуль jetpack: пробел в воздухе — тяга вверх (и разгон по WASD), Shift в воздухе — плавный
# спуск. В невесомости (вакуумные карты модуля gravity) ранец не работает — там своё управление.

fuel:
  capacity: 1200        # ёмкость ранца, «тиков тяги» (20 = 1 секунда полёта вверх)
  canister: 400         # одна канистра добавляет столько
  burn-thrust: 1.0      # расход за тик при тяге вверх
  burn-descent: 0.35    # расход за тик при плавном спуске
  start-full: true      # выданный командой ранец — с полным баком

# Полёт (блоки за тик; 1 блок/тик = 20 блоков/с). Шлётся моду при входе и после /hojet reload.
flight:
  up-accel: 0.13        # прибавка к скорости вверх за тик при тяге (гравитация игры — 0.08)
  max-up: 0.42          # предел скорости подъёма (≈ 8 бл/с)
  side-accel: 0.035     # разгон по WASD при тяге
  max-side: 0.55        # предел горизонтальной скорости от ранца (≈ 11 бл/с)
  descent: 0.16         # Shift: скорость плавного спуска (≈ 3 бл/с)
