# Axiom — серверная часть клиентского редактора мира Axiom 6.1.x (Minecraft 1.21.11).
# Протокол — как у AxiomPaperPlugin (MIT, см. LICENSE-axiom-paper.txt в jar). Включается только операторам (/hoop).

# Карты, где можно править (пусто — все). Имя — папка в maps/.
allowed-maps: []

# Запрет правок с этого X и дальше: верфь кораблей (TallChunk.YARD_X0 = 400000 − 64). Отрицательное — без запрета.
deny-x-from: 399936
# Слать клиенту рамку разрешённой зоны (верфь вне её): клиент сам не даст туда тянуть кисти
send-bounds: true

# Туннель (крупные пакеты клиента режутся на куски): размер куска и всего пакета, байт — уходят клиенту в axiom:enable
tunnel-split-size: 31000
max-tunnel-packet-size: 2097152

# Секций 16³ в секунду на игрока (клиент сдерживается сам по этому числу); превышение — кик, как у плагина
sections-per-second: 1024
kick-too-fast: true
# Сколько секций из очереди правок применять за тик (на всех игроков вместе) и не дольше стольких мс за тик.
# 64 секции/тик = 1280/с — быстрее, чем клиенту можно слать (sections-per-second), очередь не копится.
sections-per-tick: 64
apply-ms-per-tick: 15
# Секций в одном буфере не больше (лишние отбрасываются — клиент их уже нарисовал, сервер не поставит!)
max-buffer-sections: 32768
# Секций в очереди правок не больше (на всех): сверху — буфер отклоняется с сообщением (защита памяти сервера)
max-queued-sections: 65536
# Предел NBT одной блок-сущности после распаковки, байт
max-nbt-bytes: 131072

# Запрос секций клиентом (кисти читают мир): дальность в чанках от игрока (|dx|+|dz|) и предел секций в запросе.
# Незагруженные столбцы не грузим — их секции просто не попадают в ответ.
max-chunk-distance: 256
max-request-sections: 8192

infinite-reach-limit: 256

# Разрешения, которые видит клиент (имена — как у плагина: axiom.all, axiom.tool.*, …)
allowed-permissions: [axiom.all]
denied-permissions: [axiom.entity.*, axiom.blueprint.*, axiom.annotation.*, axiom.build_dangerous.*, axiom.player.teleport, axiom.world.*]

# Упаковка координат в «сырых» long (ключи секций, BlockPos.asLong): auto — по TallWorld (высокий мир → 24/24/16),
# tall, vanilla (26/26/12)
raw-pos: auto
# Метка конца списков в ответах: auto (как прислал клиент в set_buffer, иначе по raw-pos), tall, vanilla
terminator: auto

# set_block: соседние обновления (правила установки Minestom). false — ставим ровно то состояние, что прислал клиент
neighbor-updates: false
# Игроку без OP один раз сказать, что Axiom тут только операторам
goodbye-non-op: true
# Подробный лог (каналы, размеры буферов)
debug: false
