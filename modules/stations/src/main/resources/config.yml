# Станции. Регионы хранятся в module/stations/regions.json (команды /hostation, только OP).

# Как часто проверять, в каком регионе игрок (тиков). Вход/выход — сообщение и событие StationsApi.
check-period: 4

# Урон от падения внутри региона с обычной гравитацией (множитель, как maps.<карта>.fall у survival).
# На вакуумных картах survival ставит 0 — внутри станции падать должно быть больно, как обычно. −1 — не трогать.
fall-multiplier: 1.0
# При входе в регион с гравитацией — не считать падение столько мс (метка hoka_fall_safe_until у survival).
fall-safe-ms: 3000

# Тексты (игрок без мода видит их в чате и над хотбаром; с модом — надпись по центру сверху).
text:
  # снаружи регионов; на картах из outside-maps — свой текст
  outside: "Открытый космос"
  outside-maps:
    world: "Вне станции"
  gravity-normal: "гравитация 1g"
  gravity-vacuum: "невесомость"
  gravity-map: ""

# Цвета границ у клиентского модуля (RGB, hex)
colors:
  normal: "66CCFF"     # обычная гравитация — голубой
  vacuum: "FFB040"     # вакуум — янтарный
  map: "B8C0D0"        # как у карты — серо-голубой
  selection: "FFE040"  # выделение указкой — жёлтый

# /hostation show — на сколько секунд показать все регионы
show-seconds: 30
