# Свои предметы. Рисует их мод Hoka Odyssey (в руке, в инвентаре, на земле, в рамке): иконка и модель приходят с
# сервера и появляются у игроков сразу — без ресурспака и без перезагрузок. Игрок без мода видит сам `material`.
# Предмет помечен в custom_data меткой hoka_item = <id> — по ней другие модули узнают свой предмет.
#
# Файлы (PNG, .bbmodel) — в module/hoitems/assets/. Изменили → /hoitem reload. Выдать: /hoitem give <id> [кол-во].
#
# Поля:
#   name      — название
#   color     — цвет названия: white, gray, red, gold, yellow, green, aqua, blue, light_purple, dark_red, …
#   lore      — строки описания (серым)
#   material  — ванильный предмет под капотом (по умолчанию paper): его видят игроки без мода, от него — поведение
#               (еда, инструмент…)
#   icon      — PNG-иконка (рисуется с объёмом, как ванильные предметы; до 256×256)
#   model     — .bbmodel; если есть и icon — в инвентаре иконка, в руке и на земле модель
#   display   — как держать: item (как обычный предмет), handheld (как меч/кирка), block (как блок).
#               По умолчанию: иконка — item; модель — положения из самой модели (вкладка Display в Blockbench),
#               а если их там нет — block
#   scale     — множитель размера во всех видах (1 — как есть)
#   stack     — размер стопки (1..99; по умолчанию как у material)
#   layer     — cutout (по умолчанию) или translucent (полупрозрачные пиксели)
items:
  ruby:
    name: "Рубин"
    color: red
    lore: ["Тестовый предмет: иконка с сервера"]
    icon: ruby.png
  hoe:
    name: "Тяпка"
    color: gold
    lore: ["Тестовый предмет: модель .bbmodel"]
    material: wooden_hoe
    model: tyapka.bbmodel
