# ───── Призыв ─────
summon:
  # В каком радиусе от игрока искать свободное место (блоков)
  radius: 40
  # Свободный зазор вокруг корабля (блоков) — чтобы не прилипать к постройкам
  margin: 1

# ───── Полёт ─────
flight:
  # Скорость «двигателя» — атрибут flying_speed невидимого гаста, на котором сидит пилот (у ванильного гаста 0.05).
  # Скорость растёт примерно как квадрат: 0.05 ≈ 4 бл/с, 0.09 ≈ 12 бл/с, 0.15 ≈ 32 бл/с, 0.2 ≈ 58 бл/с
  speed: 0.15
  # Форсаж на Ctrl (бег): во сколько раз больше speed (скорость растёт как квадрат: ×1.3 ≈ ×1.7 к скорости)
  boost: 1.3
  # Размер гаста-двигателя (0.0625 — самый маленький; от него зависит, во что он упирается на стороне клиента)
  engine-scale: 0.0625
  # Курс (влево/вправо) доворачивает сам клиент — 8% оставшегося угла за тик (так устроен ванильный гаст).
  # Ниже — только наклон носа вверх/вниз за взглядом:
  # наибольшая скорость наклона, градусов в секунду
  turn-speed: 90
  # разгон наклона, градусов в секунду²
  turn-accel: 360
  # доля оставшегося угла за тик (0.08 — как у курса)
  turn-smoothing: 0.08
  # Упреждение поворота модели, тиков (-1 — по пингу пилота): модель догоняет то, что клиент уже повернул
  predict-ticks: -1
  # Сглаживание упреждения (0..1): меньше — модель поворачивается мягче, но чуть отстаёт
  predict-smoothing: 0.5
  # Журнал полёта в лог сервера раз в 5 с (скорость, пакеты, откаты) — для настройки
  debug: true
  # Подсказка вместо «Нажмите Shift, чтобы спешиться» (в паке, меняется после перезапуска модуля)
  mount-hint: "Корабль: мышь — прицел, W — вперёд по носу, F — посадка"
  # Наибольший наклон носа вверх/вниз, градусов (камера Minecraft упирается в ±90)
  max-pitch: 85
  # Сажать можно, только если нос наклонён не больше, градусов
  land-max-pitch: 30
  # Как часто обновлять поворот модели, тиков (меньше — плавнее, но больше трафика; между обновлениями — плавно)
  model-update-ticks: 2
  # Высота «посадки» модели на пилоте: где клиент рисует пассажиров игрока (подстройка, если корабль висит выше/ниже)
  rider-y: 1.8
  # На какой высоте над блоком места пилота стоят его ноги в полёте
  seat-height: 0.5
  # Как часто проверять столкновения с рельефом, тиков (1 — каждый тик; 0 — не проверять)
  collision-ticks: 1
  # Дальность камеры пилота в виде от 3-го лица (F5), блоков. 0 — по размеру корабля (4…32)
  camera-distance: 0

# ───── Прицел носа (куда сейчас смотрит корабль; обычный прицел игры — цель) ─────
reticle:
  enabled: true
  # Значок и цвет
  text: "◎"
  color: "#7CF2FF"
  # На каком расстоянии перед носом рисовать, блоков
  distance: 40
  # Размер значка
  scale: 6

# ───── Чертежи ─────
templates:
  # Максимум блоков в корабле (модель в полёте — по сущности на блок)
  max-blocks: 3000
