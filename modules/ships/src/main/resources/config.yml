# ───── Призыв ─────
summon:
  # В каком радиусе от игрока искать свободное место (блоков)
  radius: 40
  # Свободный зазор вокруг корабля (блоков) — чтобы не прилипать к постройкам
  margin: 1

# ───── Полёт ─────
flight:
  # Скорость полёта (как скорость полёта в креативе: 0.05 — обычная, 0.1 — быстро, 0.3 — очень быстро)
  speed: 0.12
  # Скорость поворота корабля за взглядом пилота, градусов в секунду (инерция поворота)
  turn-speed: 90
  # Как часто обновлять поворот модели, тиков (меньше — плавнее, но больше трафика)
  model-update-ticks: 2
  # Высота «посадки» модели на пилоте: где клиент рисует пассажиров игрока (подстройка, если корабль висит выше/ниже)
  rider-y: 1.8
  # На какой высоте над блоком места пилота стоят его ноги в полёте
  seat-height: 0.5
  # Как часто проверять столкновения с рельефом, тиков (0 — не проверять)
  collision-ticks: 4

# ───── Чертежи ─────
templates:
  # Максимум блоков в корабле (модель в полёте — по сущности на блок)
  max-blocks: 3000
