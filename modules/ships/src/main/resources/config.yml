# Корабли. Корабль ведёт МОД пилота (клиентский модуль ships): физика, управление, камера, столкновения — у него,
# без задержки. Сервер проверяет (раздел check) и показывает корабль остальным. Разделы flight, aim, camera, hud
# уходят моду при взлёте — поменяли здесь → homodule reload ships → со следующего взлёта летит по-новому.

summon:
  radius: 40            # где искать место для призванного корабля
  margin: 1

templates:
  max-blocks: 3000

flight:
  max-speed: 50         # блоков/с на полном ходу
  boost: 1.4            # форсаж (Ctrl+W) — во столько раз быстрее
  boost-fov: 1.12       # форсаж: поле зрения шире во столько раз
  reverse: 0.3          # назад (S) — доля от полного хода
  lift: 0.3             # вверх/вниз по «вверх» корабля (пробел/Shift)
  roll-speed: 120       # °/с — крен на A/D (D — правый борт вниз); пределов нет — бочка, полёт вверх ногами
  roll-accel: 480       # °/с² — как быстро набирается и гаснет крен
  accel-time: 3         # с до полного хода
  boost-time: 2
  brake-time: 1.5       # торможение (S или встречный ход)
  coast-time: 8         # накат: без газа скорость гаснет за столько секунд
  grip-time: 1          # «сцепление»: как быстро гаснет занос вбок/вверх
  turn-speed: 90        # °/с — самый быстрый поворот носа к прицелу
  turn-accel: 360       # °/с² — как быстро набирается поворот
  turn-smoothing: 0.08  # доля оставшегося угла за тик (меньше — плавнее доводка)
  seat-height: 0.5      # высота точки пилота над низом клетки сиденья
  land-max-pitch: 30    # сесть можно, если нос и крен не круче
  others-interp-ticks: 3   # сглаживание корабля у остальных игроков
  debug: true
  debug-every: 200

aim:
  sensitivity: 0.5      # мышь → прицел
  max-yaw: 35           # прицел не уходит от носа дальше (°, в осях корабля) — упирается в край
  max-pitch: 25

camera:
  eye-height: 1.1       # глаза пилота над точкой пилота (вид из кабины; камера повёрнута вместе с кораблём)
  chase-per-size: 1.2   # вид сзади (F5): дальше на столько × размер корабля
  chase-height: 0.35    # …и выше на столько × размер
  chase-smoothing: 0.15 # мягкость камеры сзади (доля за кадр при 60 к/с)

hud:
  enabled: true
  color: "#C8CDD6"      # серый
  accent: "#FFFFFF"

interact:               # клики по стоящему кораблю-модели (мод находит, куда смотрит игрок)
  reach: 7              # дальше этого (блоков от глаз) клик не принимается
  others: true          # двери, люки, сундуки — может любой игрок (false — только владелец и OP)

build:
  others: false         # ставить/ломать блоки корабля — только владелец и OP (true — любой)

check:                  # проверки сервера (что присылает мод)
  speed-margin: 1.3     # не быстрее форсажа × столько
  slack: 1.5            # + блоков допуска
  samples: 64           # сколько внешних клеток корабля проверять на «в блоках»
  hits: 4               # столько в блоках — положение не принимается
  max-strikes: 100      # столько отказов подряд — аварийная посадка
  timeout-ticks: 200    # мод молчит столько тиков — аварийная посадка
  above-world: 256      # насколько выше мира можно подняться
