# survival — режим выживания: здоровье, урон, голод, еда, смерть, сохранение игроков.
# Перечитать: homodule reload survival. Режим игры: /gm <survival|creative|adventure|spectator> [ник] (только OP).

# Режим при входе для всех, у кого нет своего (/gm запоминается за игроком).
default-gamemode: survival

# Бой игрок против игрока.
pvp: true

# true — вещи остаются у игрока после смерти; false — выпадают на месте смерти (как в ванили).
keep-inventory: false

hunger:
  # Голод: тратится на бег, прыжки, удары, ломание блоков, лечение; ниже 7 — нельзя бежать.
  enabled: true
  # Голод не убивает ниже этого здоровья (1 = полсердца, как на «Нормальной» сложности; 0 — убивает).
  starve-to: 1.0

damage:
  # Урон от падения: блоков без урона (в ванили 3), дальше — 1 за блок.
  fall: true
  fall-free-blocks: 3
  # Урон за полсекунды в лаве / в огне / в блоке (удушье) / на магме (раз в секунду) / при горении (раз в секунду).
  lava: 4.0
  in-fire: 1.0
  suffocation: 1.0
  magma: 1.0
  burning: 1.0
  # Пустота: ниже низа карты (gen_min_y в map.yml) на столько блоков — урон 4 раз в полсекунды.
  void-below: 64
  void: 4.0
  # Неуязвимость после удара (тиков), как в ванили — 10.
  invulnerable-ticks: 10

# Особые карты: множитель урона от падения (0 — без урона, например в невесомости).
maps:
  galaxy1:
    fall: 0.0

# Ломание блоков в выживании даёт сам блок (камень — булыжник, руды — ресурсы и т.п.).
block-drops: true

save:
  # Раз во сколько минут сохранять всех игроков (ещё — при выходе и выключении сервера).
  interval-minutes: 5
  # Возвращать игрока туда, где он вышел (карта и точка); false — как раньше, на основную карту.
  restore-position: true
