# Корабли-модели (модуль vessels). Корабль — модель Blockbench (.bbmodel, кубы и меши), её рисует клиентский
# модуль vessels мода Hoka Odyssey. Файл модели кладётся в module/clientmods/files/<model> (раздаёт clientmods),
# после правки этого файла — /hovessel reload.

# Виды кораблей. Система корабля: начало — середина габарита модели, нос — +Z модели (после поворота turn),
# верх — +Y, левый борт — +X; 1 блок = 16 пикселей Blockbench × scale.
kinds:
  corabll:
    model: vessels/corabll.bbmodel   # путь в module/clientmods/files/
    scale: 1.0                       # 1 — 16 пикселей Blockbench = блок
    # Нос corabll в осях модели — −Z (после поворота кости на 90° по X): туда опускается лобовое стекло кабины,
    # туда смотрят концы длинных балок; сопла и голубое пламя — на +Z. Поэтому разворот на 180°.
    turn: 180                        # поворот модели вокруг вертикали (°), если нос модели смотрит не в +Z
    # Глаза пилота: точка модели (0, 41, 24) px — над плоским тёмным стеклом кабины (его верх y 39.1, низ 32.8,
    # z 13…51.5), на уровне края боковых стенок кабины (y 40.7), сразу за верхом лобового стекла (z 13.1).
    # Середина модели — (0, 24.37, 21.06) px → (0, 16.63, 2.94) px = (0, 1.04, 0.18) блока, после turn 180 z → −z.
    seat: [0, 1.04, -0.18]           # место пилота — его глаза, от середины модели в блоках: x — влево, y — вверх, z — к носу
    speed: 30                        # ход, блоков/с (W)
    boost-speed: 50                  # форсаж, блоков/с (Ctrl+W)
    accel: 15                        # разгон, блоков/с² (торможение — вдвое быстрее)
    turn-speed: 90                   # поворот носа (курс и наклон), °/с
    roll-speed: 120                  # крен (A/D), °/с
    # Стволы орудия (система корабля, блоки: x — влево, y — вверх, z — к носу), стреляют по очереди.
    # У corabll — концы двух длинных балок спереди (x ±2, чуть ниже середины, у носа z 6.6).
    guns: [[2.0, -0.5, 6.9], [-2.0, -0.5, 6.9]]
    hull:
      hp: 200                        # прочность корпуса (vessels-4)
    # Зоны повреждений — силуэт сверху: борта — дальше side × полуширины от оси, нос — передняя доля длины,
    # двигатели — задняя доля (у corabll сопла сзади, длинные балки спереди по бокам — это борта)
    zones: {side: 0.35, nose: 0.25, tail: 0.22}

board-reach: 6          # ПКМ по кораблю — не дальше стольких блоков от его коробки
menu-reach: 6           # G — меню корабля (владелец, OP) — не дальше стольких блоков от коробки
board-slack: 1          # запас сервера к board-reach (задержка сети)
view-range: 8           # дальность видимости носителя (множитель display-сущности)
others-interp-ticks: 3  # остальные игроки видят корабль плавно: интерполяция позы, тиков
debug: false            # писать в лог отклонённые позы

# Проверки полёта на сервере (позу считает мод пилота)
check:
  speed-margin: 1.3     # путь за тик не больше форсажа × это
  slack: 1.5            # + блоков
  turn-margin: 1.5      # поворот за тик не больше наибольшей скорости поворота × это
  turn-slack: 10        # + градусов
  max-dt-ticks: 40      # пауза в позах учитывается не дольше (лаг)
  above-world: 256      # выше мира — не дальше стольких блоков
  samples: 64           # клеток корпуса на проверку «в блоках»
  hits: 4               # столько в твёрдых блоках — поза не принята
  max-strikes: 100      # столько отказов подряд — пилот снимается
  timeout-ticks: 200    # мод молчит столько тиков — пилот снимается

# Управление у мода (как у кораблей ships)
aim:
  sensitivity: 0.5      # мышь → прицел
  max-yaw: 35           # прицел дальше от носа не уходит, °
  max-pitch: 25
control:
  turn-smoothing: 0.08  # доля угла до прицела за тик
  turn-accel: 360       # разгон поворота, °/с²
  roll-accel: 480
  reverse: 0.3          # задний ход — доля от speed
  lift: 0.3             # вверх/вниз (пробел/Shift) — доля от speed
  coast-time: 8         # без газа скорость гаснет (90%) за столько секунд
  grip-time: 1          # снос вбок гаснет за столько секунд
camera:
  eye-height: 0         # глаза от места пилота вверх (по кораблю), блоков
  chase-per-size: 1.2   # F5: камера сзади на (радиус модели × это)
  chase-height: 0.35    # и выше на (радиус × это)
  chase-smoothing: 0.15
hud:
  enabled: true
  hide-vanilla: true    # пока пилот: спрятать хотбар, сердца, еду, броню, опыт и HUD выживания (ядро мода 0.79+)

# Орудие корабля (ЛКМ пилота): бьёт туда, куда наведено голубое перекрестие (прицел мыши)
gun:
  range: 300            # дальность, блоков
  cooldown: 0.5         # задержка между выстрелами, с (× улучшения «Орудие+»)
  damage: 6             # урон за попадание (× «Орудие+»), 2 = сердце
  bolt-speed: 220       # скорость болта, блоков/с (урон — когда долетел)
  break-blocks: false   # ломать ли блок в точке попадания

# Топливо: бак — 4 слота меню корабля, запас = сумма предметов «Топливо» (vessel_fuel) в них
fuel:
  burn-per-minute: 0    # расход в полёте, штук в минуту (0 — обычный полёт топливо не тратит)
  empty-speed: 0.25     # при расходе > 0 и пустом баке — аварийный ход (доля скорости)

# Варп-прыжок (R пилота)
warp:
  distance: 10000       # вперёд по носу, блоков (урезается границей карты map.yml border и высотой мира)
  cost: 0.25            # доля полного бака (× «Бак+»)
  charge: 3             # зарядка, с (R ещё раз — отмена)
  cooldown: 30          # перезарядка после прыжка, с (× «Варп-катушка»)
  max-shift: 32         # точка в блоках — сдвиг назад по курсу / вверх не дальше стольких блоков
  min-jump: 64          # ближе к границе карты, чем столько, — прыжка нет
  wait-load: 10         # ждать загрузки точки прыжка, с

# Улучшения (слоты меню), одинаковые складываются; скидки — не ниже min-factor
upgrades:
  engine: {speed: 0.10}                 # «Двигатель+»: скорость и форсаж +10%
  tank: {warp-cost: 0.10}               # «Бак+»: расход варпа −10%
  gun: {reload: 0.10, damage: 0.10}     # «Орудие+»: перезарядка −10%, урон +10%
  warp: {warp-reload: 0.15}             # «Варп-катушка»: перезарядка варпа −15%
  min-factor: 0.1

# Твёрдый корпус: по кораблю ходят и упираются в него (столкновения считает мод игрока, по клеткам в полблока)
hull:
  solid: true           # false — сквозь корабль можно пройти (как раньше)
  carry: true           # стоящих на корабле корабль везёт с собой (и толкает тех, в кого влетел)
  # vessels-4: прочность (у вида — kinds.<вид>.hull.hp), бой, ремонт
  repair-kit: 50        # «Ремкомплект» чинит столько прочности
  engine-broken-speed: 0.7   # зона «двигатели» разбита (0%) — ход × это; 1 — зоны на полёт не влияют
  impact:               # удар о блоки на скорости (считает мод пилота, сервер сверяет со своей скоростью)
    enabled: true
    min-speed: 12       # бл/с: медленнее — без урона
    damage-per-speed: 2 # урон за каждый бл/с сверх min-speed
    cooldown: 0.5       # с: удары не чаще

# Карты: планета или космос. Космос — карты отсюда и карты с generator: space в maps/<карта>/map.yml; остальные —
# планеты: там «подушка» и лучи.
space-maps: [cosmos]
planet:
  enabled: true         # false — подушки и лучей нет нигде
  clearance: 10         # корпус не подходит к блокам ближе (вниз, вбок, вверх)
  soft: 6               # отталкивание начинается за столько блоков до clearance и растёт к нему
  climb: 0.8            # упёрся вбок (гора, стена) — доля скорости уходит вверх (огибает)
  server-tolerance: 3   # сервер поправляет пилота, если тот ближе clearance − это (и приближается)
  beam-reach: 16        # посадка лучом и меню (G) с земли — не дальше стольких блоков от корабля
  beam-down-speed: 4    # бл/с — выход (F): луч опускает
  beam-up-speed: 7      # бл/с — посадка: луч поднимает

# ── vessels-4: топливо и улучшения в выживании ──
# Добыча (не в творческом): блок → шанс (0…1) и сколько «Топливных кристаллов» (vessel_crystal) выпадает. Ключ —
# свой блок модуля blocks (hoka:<id>, руды астероидов генератора space) или ванильный (minecraft:coal_ore).
fuel-drops:
  hoka:uranium_ore: {chance: 0.6, min: 1, max: 3}
  hoka:platinum_ore: {chance: 0.4, min: 1, max: 2}
  hoka:cobalt_ore: {chance: 0.3, min: 1, max: 2}
  hoka:silver_ore: {chance: 0.25, min: 1, max: 1}
  hoka:gold_ore: {chance: 0.25, min: 1, max: 1}
  hoka:silicon_ore: {chance: 0.2, min: 1, max: 1}
  hoka:magnesium_ore: {chance: 0.2, min: 1, max: 1}
  hoka:nickel_ore: {chance: 0.15, min: 1, max: 1}
  hoka:coal_ore: {chance: 0.12, min: 1, max: 1}
  hoka:iron_ore: {chance: 0.1, min: 1, max: 1}
  hoka:copper_ore: {chance: 0.1, min: 1, max: 1}
  hoka:meteor_rock: {chance: 0.05, min: 1, max: 1}

# Мастерская (меню корабля G → «Мастерская»): берёт из груза корабля (27 слотов), кладёт туда же (топливо — в бак).
# Не больше 8 рецептов. Предметы: vessel:<fuel|crystal|repair|engine|tank|gun|warp>, hoka:<свой блок>,
# item:<предмет hoitems>, minecraft:<ванильный>. result — что получится, count — сколько, needs — что нужно.
recipes:
  fuel:
    result: vessel:fuel
    count: 16
    needs:
      vessel:crystal: 4
  repair:
    result: vessel:repair
    needs:
      hoka:iron_ore: 4
      hoka:nickel_ore: 2
      vessel:crystal: 1
  engine:
    result: vessel:engine
    needs:
      hoka:cobalt_ore: 6
      hoka:platinum_ore: 2
      vessel:crystal: 8
  tank:
    result: vessel:tank
    needs:
      hoka:magnesium_ore: 8
      hoka:copper_ore: 6
      vessel:crystal: 4
  gun:
    result: vessel:gun
    needs:
      hoka:silver_ore: 4
      hoka:iron_ore: 8
      vessel:crystal: 6
  warp:
    result: vessel:warp
    needs:
      hoka:uranium_ore: 2
      hoka:gold_ore: 4
      hoka:silicon_ore: 6
      vessel:crystal: 12

# Свои названия предметов в рецептах (иначе — встроенные для руд космоса и предметов кораблей)
item-names: {}
