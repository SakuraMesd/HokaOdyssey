# ───── Раздача пака ─────
http:
  # Порт встроенного HTTP-сервера (должен быть открыт наружу; в Pterodactyl — отдельный порт сервера)
  port: 25574
  # Адрес, по которому игроки скачивают пак (то, что увидит клиент). Имя файла допишется само.
  public-url: "http://2.152.87.39:25574"

# ───── Игрокам ─────
pack:
  # Отправлять пак при входе
  send-on-join: true
  # true — без пака на сервер не пустит (кик при отказе / ошибке загрузки)
  required: false
  # Текст в окне «Скачать пак?»
  prompt: "Пак Hoka Odyssey: модели кораблей и эффекты"
  # Описание пака в списке паков
  description: "Hoka Odyssey"

# ───── Ванильные ассеты ─────
vanilla:
  # Версия клиента, из которой брать формы блоков (blockstates/models) — скачивается с серверов Mojang один раз
  version: "1.21.11"
